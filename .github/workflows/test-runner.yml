  macos-cmake:
    name: macOS-CMake
    uses: ./.github/workflows/macos-cmake.yml # zizmor: ignore[secrets-inherit]
    with:
      # Build the full matrix only on push events to the default branch, or
      # when PR gets the has a `gha:full-build` label, or when it had the
      # label already and it gets a new commit.
      full-matrix: |-
        ${{
          github.event_name == 'schedule' ||
          github.event_name == 'push' ||
          contains(github.event.pull_request.labels.*.name, 'gha:full-build')
        }}
      sccache-mode: >-
        ${{
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'READ_WRITE' || 'READ_ONLY'
        }}
      vcpkg-cache-mode: >-
        ${{
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'readwrite' || 'read'
        }}
      execute-integration-tests: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    secrets: inherit # zizmor: ignore[secrets-inherit]
  windows-cmake:
    name: Windows-CMake
    uses: ./.github/workflows/windows-cmake.yml # zizmor: ignore[secrets-inherit]
    with:
      # Build the full matrix only on push events to the default branch, or
      # when PR gets the has a `gha:full-build` label, or when it had the
      # label already and it gets a new commit.
      full-matrix: |-
        ${{
          github.event_name == 'schedule' ||
          github.event_name == 'push' ||
          contains(github.event.pull_request.labels.*.name, 'gha:full-build')
        }}
      # The current versions of sccache, cmake, ninja, and msvc result in a
      # combination that is incompatible. Dsiabling sccache for now.
      sccache-mode: 'DISABLED'
      vcpkg-cache-mode: >-
        ${{
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'readwrite' || 'read'
        }}
      execute-integration-tests: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    secrets: inherit # zizmor: ignore[secrets-inherit]
  notify:
    name: Notify-Google-Chat
    # Wait until all the other jobs have completed.
    needs:
#      - external-account-integration
#      - macos-bazel
      - macos-cmake
#      - windows-bazel
#      - windows-cmake
    # Run even if the other jobs failed or were skipped.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Google Chat
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          case "${event_name}" in
            schedule)
              ;;
            push)
              ;;
            *)
              exit 0
              ;;
          esac
          failure="${{ contains(needs.*.result, 'failure') }}"
          cancelled="${{ contains(needs.*.result, 'cancelled') }}"
          status=""
          # Report whether any of the jobs failed or were cancelled.
          if [[ "${cancelled}" == "true" ]]; then status="cancelled"; fi
          if [[ "${failure}" == "true" ]]; then status="failure"; fi
          # Exit early if there is nothing interesting to report.
          if [[ -z "${status}" ]]; then exit 0; fi
          printf '{"text": "GHA Build %s %s/%s/actions/runs/%s"}' \
            "${status}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" |
          curl -fsX POST -o /dev/null -d@- -H "Content-Type: application/json; charset=UTF-8" '${{ secrets.CLOUD_CPP_BUILD_ALERTS_WEBHOOK }}'
